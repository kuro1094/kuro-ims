server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: kuro-ims
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:kuro_ims}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:kid14120904}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.kuro.ims.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # 生产环境请通过环境变量覆盖
  secret: kuro-ims-jwt-secret-key-2024-very-long-and-secure-string
  # token 有效期（毫秒）：2 小时
  expire: 7200000
  # 刷新 token 有效期：7 天
  refresh-expire: 604800000
  header: Authorization
  prefix: "Bearer "

logging:
  level:
    com.kuro.ims: info
